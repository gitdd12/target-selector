<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>대상 선별</title>
<style>
:root{
  --surface:#FFFFFF;
  --panel:#F0F0F0;
  --line:#111111;
  --ink:#111111;
  --dim:#444444;
  --accent:#0B5D6B;
  --warn:#B2402F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--surface);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  display:flex;justify-content:center;
  min-height:100vh;padding:20px 14px;
}
.container{width:100%;max-width:440px;padding-top:8px}

.readout{display:flex;border:1.5px solid var(--ink);margin-bottom:10px}
.cell{flex:1;padding:7px 10px;border-right:1.5px solid var(--ink)}
.cell:last-child{border-right:none;text-align:right}
.cell .k{font-size:11px;color:var(--dim);display:block}
.cell .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.cell .v.warn{color:var(--warn)}

.progress-track{width:100%;height:6px;background:var(--panel);border:1px solid var(--ink);margin-bottom:26px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:100%;transition:width .1s linear}
.progress-fill.warning{background:var(--warn)}

.intro-title{font-size:23px;font-weight:700;text-align:center;margin:36px 0 14px;word-break:keep-all;line-height:1.5;letter-spacing:-.01em}
.intro-sub{text-align:center;color:var(--dim);font-size:14.5px;font-weight:400;margin-bottom:28px;line-height:1.65}

.divider{border-top:1.5px solid var(--ink);margin:0 0 22px}
.practice-label{text-align:center;color:var(--dim);font-size:12.5px;font-weight:400;margin-bottom:14px}
.practice-title{font-size:19px;opacity:.92}

.target-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px;word-break:keep-all;line-height:1.3}
.target-desc{text-align:center;color:var(--dim);font-size:14px;font-weight:400;margin-bottom:24px;line-height:1.55}

.scale-container{display:flex;flex-direction:column;gap:8px}
.scale-btn{
  background:transparent;border:1.5px solid var(--ink);color:var(--ink);
  padding:13px 16px;font-size:15px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  font-family:inherit;width:100%;text-align:left;
}
.scale-btn:active{background:rgba(11,93,107,.12)}
.scale-btn.picked{background:var(--ink);color:var(--surface)}
.scale-btn.picked .n{color:var(--surface)}
.scale-btn .n{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

.step2-title{font-size:19px;font-weight:700;text-align:center;margin-bottom:6px;word-break:keep-all}
.step2-sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:20px}

.chip-grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:26px}
.chip{
  background:var(--panel);border:1.5px solid var(--ink);color:var(--ink);
  padding:10px 14px;font-size:14.5px;cursor:pointer;
  display:flex;align-items:center;gap:7px;font-family:inherit;
}
.chip:active{background:rgba(178,64,47,.15);border-color:var(--warn);color:var(--warn)}
.chip .x{font-weight:700;opacity:.55}

button.complete{
  width:100%;background:var(--ink);color:var(--surface);border:none;
  padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;
}

.result-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
.result-sub{text-align:center;color:var(--dim);font-size:13.5px;margin-bottom:22px;line-height:1.5}
.result-list{display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
.result-item{
  background:var(--panel);border:1.5px solid var(--ink);
  padding:11px 14px;display:flex;gap:10px;align-items:baseline;
}
.result-item .num{font-size:12px;color:var(--dim);font-weight:700;flex:none;width:20px}
.result-item .name{font-size:15px;font-weight:600}

.hint{font-size:12.5px;color:var(--dim);margin:10px 0 6px}
textarea.out{
  width:100%;height:120px;font:11.5px/1.4 ui-monospace,Menlo,monospace;
  border:1.5px solid var(--ink);background:#fff;padding:8px;resize:none;margin-bottom:10px;
}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);
  padding:12px;font-size:14px;width:100%;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
(function(){

const TARGET_LIST = [
  { id:1,  category:'물질', name:'신체 (움직임, 자세, 체력)' },
  { id:2,  category:'물질', name:'재료 (음식, 나무, 천, 흙, 금속)' },
  { id:3,  category:'물질', name:'기계·장비 (가전, 차량, 공구, 설비)' },
  { id:4,  category:'물질', name:'공간 (방, 매장, 건물, 무대)' },
  { id:5,  category:'물질', name:'물건 (수집품, 옷, 장비, 상품)' },
  { id:6,  category:'물질', name:'생물 (식물, 동물)' },
  { id:7,  category:'사람', name:'사람 (마음, 말, 관계)' },
  { id:8,  category:'기호', name:'글, 문서' },
  { id:9,  category:'기호', name:'데이터, 숫자' },
  { id:10, category:'기호', name:'코드' },
  { id:11, category:'기호', name:'수식' },
  { id:12, category:'기호', name:'개념' },
  { id:13, category:'기호', name:'그림, 이미지' },
  { id:14, category:'기호', name:'소리, 음악' },
  { id:15, category:'기호', name:'영상' },
];

const SCALE_LABELS = {
  1:'매우 안 끌린다', 2:'안 끌린다', 3:'아주 조금 안 끌린다',
  4:'보통이다',
  5:'아주 조금 끌린다', 6:'끌린다', 7:'매우 끌린다'
};
const DURATION = 10.0;
const TARGET_COUNT = 4;

let state = {
  step: 0,
  currentIndex: 0,
  scores: {},
  timedOut: {},
  answerMs: {},
  itemStart: 0,
  survivors: [],
  initialSurvivorCount: 0,
  timeLeft: DURATION,
  timerId: null,
  runStart: Date.now(),
};

const app = document.getElementById('app');

function startTimer(){
  if(state.timerId) clearInterval(state.timerId);
  state.itemStart = Date.now();
  state.timeLeft = DURATION;
  state.timerId = setInterval(() => {
    const elapsed = (Date.now() - state.itemStart) / 1000;
    state.timeLeft = Math.max(0, DURATION - elapsed);
    updateTimerUI();
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      handleRate(4, true);
    }
  }, 60);
}

function updateTimerUI(){
  const fill = document.getElementById('progress-fill');
  const timeText = document.getElementById('time-text');
  if(!fill || !timeText) return;
  const percent = (state.timeLeft / DURATION) * 100;
  fill.style.width = percent + '%';
  fill.classList.toggle('warning', state.timeLeft <= 3);
  const cell = timeText.parentElement;
  if(cell) cell.classList.toggle('warn', state.timeLeft <= 3);
  timeText.textContent = Math.ceil(state.timeLeft) + '초';
}

function handleRate(score, isTimeout){
  if(state.timerId) clearInterval(state.timerId);
  const item = TARGET_LIST[state.currentIndex];
  state.scores[item.id] = score;
  state.timedOut[item.id] = !!isTimeout;
  state.answerMs[item.id] = Date.now() - state.itemStart;

  if(state.currentIndex < TARGET_LIST.length - 1){
    state.currentIndex++;
    render();
    startTimer();
  } else {
    let passed = TARGET_LIST.filter(t => state.scores[t.id] >= 5);
    if(passed.length === 0){
      passed = TARGET_LIST.slice();
    }
    state.initialSurvivorCount = passed.length;
    state.survivors = passed;
    state.step = (passed.length <= TARGET_COUNT) ? 3 : 2;
    render();
  }
}
window.handleRate = handleRate;

function selectPractice(btn){
  document.querySelectorAll('.practice-btn').forEach(b => b.classList.remove('picked'));
  btn.classList.add('picked');
}
window.selectPractice = selectPractice;

function beginSurvey(){
  state.step = 1;
  render();
  startTimer();
}
window.beginSurvey = beginSurvey;

function handleEliminate(id){
  state.survivors = state.survivors.filter(t => t.id !== id);
  render();
}
window.handleEliminate = handleEliminate;

function goToResults(){ state.step = 3; render(); }
window.goToResults = goToResults;

function buildExport(){
  const timedOutCount = Object.values(state.timedOut).filter(Boolean).length;
  const eliminatedCount = state.initialSurvivorCount - state.survivors.length;
  const lines = {
    '총 소요시간': Math.round((Date.now()-state.runStart)/1000) + 's',
    '5점 이상 통과 개수': state.initialSurvivorCount,
    '제거 단계에서 지운 개수': eliminatedCount,
    '시간초과로 자동 4점 처리된 항목 수': timedOutCount,
    '최종 후보': state.survivors.map(s => s.name),
    '전체 점수': TARGET_LIST.map(t => t.name + ': ' + (state.scores[t.id] ?? '-') + (state.timedOut[t.id] ? ' (시간초과)' : '')),
  };
  return JSON.stringify(lines, null, 1);
}

function render(){
  if(state.step === 0){
    const scaleHtml = [7,6,5,4,3,2,1].map(score =>
      '<button class="scale-btn practice-btn" onclick="selectPractice(this)">' +
        '<span>' + SCALE_LABELS[score] + '</span>' +
        '<span class="n">' + score + '점</span>' +
      '</button>'
    ).join('');
    app.innerHTML =
      '<div class="intro-title">돈이 더 이상 문제가 안 됩니다.<br>그래도 뭔가 일을 하고 싶습니다.</div>' +
      '<div class="intro-sub">다음 대상을 다루는 일을 하게 된다면<br>어떨지, 10초 안에 답해주세요.</div>' +
      '<div class="divider"></div>' +
      '<div class="practice-label">연습 · 시간제한 없음 · 결과에 반영되지 않음</div>' +
      '<div class="target-title practice-title">역사</div>' +
      '<div class="target-desc">한 번 눌러서 감을 잡아보세요</div>' +
      '<div class="scale-container">' + scaleHtml + '</div>' +
      '<div style="height:18px"></div>' +
      '<button class="complete" onclick="beginSurvey()">시작하기</button>';
    return;
  }
  if(state.step === 1){
    const item = TARGET_LIST[state.currentIndex];
    const scaleHtml = [7,6,5,4,3,2,1].map(score =>
      '<button class="scale-btn" onclick="handleRate(' + score + ')">' +
        '<span>' + SCALE_LABELS[score] + '</span>' +
        '<span class="n">' + score + '점</span>' +
      '</button>'
    ).join('');

    app.innerHTML =
      '<div class="readout">' +
        '<div class="cell"><span class="k">진행</span><span class="v">' + (state.currentIndex+1) + ' / ' + TARGET_LIST.length + '</span></div>' +
        '<div class="cell"><span class="k">남은 시간</span><span class="v" id="time-text">' + Math.ceil(state.timeLeft) + '초</span></div>' +
      '</div>' +
      '<div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>' +
      '<div class="target-title">' + item.name + '</div>' +
      '<div class="target-desc">돈이 문제가 안 될 때, 이걸로 일을 하고 싶나요?<br>생각하지 말고 든 느낌 그대로 고르세요</div>' +
      '<div class="scale-container">' + scaleHtml + '</div>';
    updateTimerUI();
  }

  else if(state.step === 2){
    const remaining = state.survivors.length;
    const percent = Math.max(0, Math.min(100, (remaining / state.initialSurvivorCount) * 100));
    const chips = state.survivors.map(item =>
      '<button class="chip" onclick="handleEliminate(' + item.id + ')">' +
        '<span>' + item.name + '</span><span class="x">✕</span>' +
      '</button>'
    ).join('');
    const doneBtn = remaining <= TARGET_COUNT
      ? '<button class="complete" onclick="goToResults()">결과 확인하기 (' + remaining + '개 남음)</button>'
      : '';

    app.innerHTML =
      '<div class="step2-title">그나마 덜 끌리는 것을 지워주세요</div>' +
      '<div class="step2-sub">' + TARGET_COUNT + '개 이하가 남을 때까지 터치하세요</div>' +
      '<div class="readout">' +
        '<div class="cell"><span class="k">남은 대상</span><span class="v">' + remaining + ' / ' + state.initialSurvivorCount + '</span></div>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + percent + '%"></div></div>' +
      '<div class="chip-grid">' + chips + '</div>' +
      doneBtn;
  }

  else if(state.step === 3){
    const list = state.survivors.map((item, i) =>
      '<div class="result-item"><span class="num">#' + (i+1) + '</span><span class="name">' + item.name + '</span></div>'
    ).join('');

    app.innerHTML =
      '<div class="result-title">최종 후보</div>' +
      '<div class="result-sub">이 안에서 태스크(게임)를 진행합니다.</div>' +
      '<div class="result-list">' + list + '</div>' +
      '<p class="hint">아래 내용을 복사해서 보내주세요.</p>' +
      '<textarea class="out" id="res" readonly>' + buildExport() + '</textarea>' +
      '<button class="complete" id="copyBtn">복사하기</button>' +
      '<div style="height:8px"></div>' +
      '<button class="ghost" onclick="location.reload()">처음부터 다시하기</button>';

    document.getElementById('copyBtn').onclick = () => {
      const ta = document.getElementById('res');
      const btn = document.getElementById('copyBtn');
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);

      let ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }

      if(ok){
        btn.textContent = '복사됨';
      } else if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(ta.value)
          .then(() => { btn.textContent = '복사됨'; })
          .catch(() => { btn.textContent = '복사 실패 · 위 내용을 직접 길게 눌러 복사해주세요'; });
      } else {
        btn.textContent = '복사 실패 · 위 내용을 직접 길게 눌러 복사해주세요';
      }
    };
  }
}

render();

})();
</script>
</body>
</html>
